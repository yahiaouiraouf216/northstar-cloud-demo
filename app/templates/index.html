<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo App</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 36px;
      max-width: 480px;
      width: 100%;
      margin: 20px;
    }
    h1 { margin-top: 0; }
    .meta { font-size: 13px; color: #94a3b8; margin-top: 20px; line-height: 1.8; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Petite app de test</h1>
    <p>Application Flask minimale, prête à être containerisée puis déployée sur AWS.</p>
    <div class="meta">
      Hostname: {{ hostname }}<br>
      Version: {{ version }}<br>
      Heure serveur: {{ now }}
    </div>
    <p><a href="/status">Voir la page status →</a></p>
  </div>
</body>
</html>
