<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 36px;
      max-width: 480px;
      width: 100%;
      margin: 20px;
    }
    .badge {
      display: inline-block;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .meta { font-size: 13px; color: #94a3b8; margin-top: 16px; line-height: 1.8; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">OK</span>
    <h1>Status de l'application</h1>
    <div class="meta">
      Hostname: {{ hostname }}<br>
      Heure serveur: {{ now }}<br>
      Visites sur cette page depuis le démarrage: {{ visit_count }}
    </div>
    <p><a href="/">← Retour à l'accueil</a></p>
  </div>
</body>
</html>
